  - id: soft_charge_reset
    mode: restart
    then:
      - lambda: |-
          ESP_LOGI("SOFT_CHARGE", "Switch toggled → resetting staged‑charge state");
          id(stage1_active)        = false;
          id(stage2_active)        = false;
          id(stage3_active)        = false;
          id(stage4_active)        = false;
          id(stage4_forced_off)    = false;
          id(stage4_elapsed_s)     = 0;
          id(prev_any_stage_active)= false;
          // Align currents with user slider so no stale value is sent
          id(last_staged_current)  = id(can_amp_input).state;
          id(pre_stage_amp)        = id(can_amp_input).state;