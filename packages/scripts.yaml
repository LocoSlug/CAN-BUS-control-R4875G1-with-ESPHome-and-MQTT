script:
  # ───────────────────────── helper script (debounced connect) ──────────────
  - id: mqtt_reconnect
    mode: restart
    then:
      # Debounce: delay 2 s so multiple edits don't trigger back-to-back connects
      - delay: 2s

      # Check all fields are present and sensible
      - lambda: |-
          if (id(g_broker).empty() || id(g_port) <= 0) {
            ESP_LOGW("config", "MQTT broker IP missing – aborting connect");
            return;
          }

      # Print the final parameters
      - logger.log:
          tag: "config"
          level: INFO
          format: "Connecting to %s:%d as %s (pw len %d)…"
          args: [ 'id(g_broker).c_str()', 'id(g_port)', 'id(g_user).c_str()', 'id(g_pass).size()' ]

      # Stop current session (if any)
      - mqtt.disable:
      - wait_until:
          condition:
            not: mqtt.connected
          timeout: 2s
      - delay: 300ms

      # Apply new parameters
      - lambda: |-
          id(mqtt_client).set_broker_address(id(g_broker));
          id(mqtt_client).set_broker_port(id(g_port));

          if (id(g_user).empty() && id(g_pass).empty()) {
            id(mqtt_client).set_username("");
            id(mqtt_client).set_password("");
            ESP_LOGI("config", "MQTT: connecting anonymously");

          } else if (!id(g_user).empty() && !id(g_pass).empty()) {
            id(mqtt_client).set_username(id(g_user));
            id(mqtt_client).set_password(id(g_pass));
            ESP_LOGI("config", "MQTT: connecting as %s (pw len %d)",
                     id(g_user).c_str(), id(g_pass).size());

          } else {
            ESP_LOGW("config", "MQTT: username or password missing – aborting connect");
            return;
          }

      # Kick it off
      - mqtt.enable:



  - id: detect_board_1_properties
    mode: single
    then:
      - lambda: |-
          id(board_properties_complete1) = false; // Reset the completion flag before starting
          id(frame_counter_bp1) = 0; // Reset the frame counter
      - while:
          condition:
            lambda: |-
              return !id(board_properties_complete1) && id(frame_counter_bp1) < 3;
          then:
            - canbus.send:
                can_id: 0x1081D2FE
                use_extended_id: true
                data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
            - delay: 1s
            - lambda: |-
                id(frame_counter_bp1) += 1; // Increment the frame counter
                ESP_LOGI("board_properties", "Frame Counter: %d", id(frame_counter_bp1));
      - lambda: |-
          if (id(board_properties_complete1)) {
            ESP_LOGI("board_properties", "Board properties detected successfully.");
          } else {
            ESP_LOGW("board_properties1", "Fail-safe triggered: Loop stopped after 3 attempts.");
          }
        
