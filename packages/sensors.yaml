# ─────────────────────────── MQTT status indicator ──────────────────────────
text_sensor:

  - platform: template
    id: ts_mqtt_status               # <-- this ID is what automations refer to
    name: "MQTT Status"
    icon: mdi:lan
    entity_category: diagnostic
    # No lambda or update-interval needed – we’ll set the text from automations

  # Power state from your existing code
  - platform: template
    id: power_state_sensor1
    name: "003 Power State Board-1"
    icon: "mdi:information-outline"

  - platform: template
    id: power_state_sensor2
    name: "003 Power State Board-2"
    icon: "mdi:information-outline"

  - platform: template
    id: power_state_sensor3
    name: "003 Power State Board-3"
    icon: "mdi:information-outline"

  - platform: template
    name: "Info: Board Type Board-1"
    id: board_type_sensor_1
    icon: "mdi:information-outline"

  - platform: template
    name: "Info: Barcode Board-1"
    id: barcode_sensor_1
    icon: "mdi:information-outline"

  - platform: template
    name: "Info: Item Number Board-1"
    id: item_no_sensor_1
    icon: "mdi:information-outline"

  - platform: template
    name: "Info: Description Board-1"
    id: description_sensor_1
    icon: "mdi:information-outline"

  - platform: template
    name: "Info: Manufacturing Date Board-1"
    id: manufactured_sensor_1
    icon: "mdi:information-outline"

  - platform: template
    name: "Info: Board Type Board-2"
    id: board_type_sensor_2
    icon: "mdi:information-outline"

  - platform: template
    name: "Info: Barcode Board-2"
    id: barcode_sensor_2
    icon: "mdi:information-outline"

  - platform: template
    name: "Info: Item Number Board-2"
    id: item_no_sensor_2
    icon: "mdi:information-outline"

  - platform: template
    name: "Info: Description Board-2"
    id: description_sensor_2
    icon: "mdi:information-outline"

  - platform: template
    name: "Info: Manufacturing Date Board-2"
    id: manufactured_sensor_2
    icon: "mdi:information-outline"

  - platform: template
    name: "Info: Board Type Board-3"
    id: board_type_sensor_3
    icon: "mdi:information-outline"

  - platform: template
    name: "Info: Barcode Board-3"
    id: barcode_sensor_3
    icon: "mdi:information-outline"

  - platform: template
    name: "Info: Item Number Board-3"
    id: item_no_sensor_3
    icon: "mdi:information-outline"

  - platform: template
    name: "Info: Description Board-3"
    id: description_sensor_3
    icon: "mdi:information-outline"

  - platform: template
    name: "Info: Manufacturing Date Board-3"
    id: manufactured_sensor_3
    icon: "mdi:information-outline"

  # ------------------ NEW LOCAL TIME TEXT SENSOR ------------------
  - platform: template
    name: "Local Time (Off-Grid)"
    id: local_time_display
    update_interval: 15s
    icon: "mdi:clock"
    lambda: |-
      // Build a string like "HH:MM"
      char buff[6];
      sprintf(buff, "%02d:%02d", id(current_hour), id(current_minute));
      return std::string(buff);

  - platform: template
    name: "Minutes Until Next On"
    id: next_on_text
    update_interval: 15s
    icon: "mdi:timer-sand"
    lambda: |-
      if (id(daily_schedule_disabled)) {
        // Return a std::string rather than a raw C string
        return std::string("Disabled");
      } else {
        char buff[16];
        sprintf(buff, "%d min", id(on_time_countdown));
        return std::string(buff);
      }

