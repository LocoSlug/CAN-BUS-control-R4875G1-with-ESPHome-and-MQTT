  # Reset the Wh counter back to 0
  - platform: template
    name: "Wh Meter RESET"
    icon: "mdi:play"
    on_press:
      then:
        - lambda: |-
            ESP_LOGI("WH_RESET", "Resetting Wh meter to 0");
            id(consumed_wh) = 0.0;

